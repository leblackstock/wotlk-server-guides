name: Temporary AH mobile highlight fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-mobile-highlight-trigger.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine mobile row selection
        shell: bash
        run: |
          git switch -C agent/fix-ah-mobile-highlight
          python - <<'PY'
          from pathlib import Path

          guide_names = [
              "mining-smithing-ah-price-guide.html",
              "blacksmithing-materials-ah-price-guide.html",
              "engineering-materials-ah-price-guide.html",
              "jewelcrafting-gems-ah-price-guide.html",
              "enchanting-mats-ah-price-guide.html",
              "alchemy-materials-ah-price-guide.html",
              "herbalism-herbs-ah-price-guide.html",
              "inscription-materials-ah-price-guide.html",
              "tailoring-cloth-ah-price-guide.html",
              "skinning-leatherworking-materials-ah-price-guide.html",
              "fishing-cooking-materials-ah-price-guide.html",
              "cross-profession-materials-ah-price-guide.html",
              "drop-turn-in-quest-page-items-ah-price-guide.html",
              "gear-pattern-drops-ah-price-guide.html",
              "utility-recipe-drops-ah-price-guide.html",
              "consumable-misc-recipe-drops-ah-price-guide.html",
          ]

          css_path = Path("assets/ah-price-guide.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "Mobile card selection uses one continuous card highlight."
          if marker in css:
              raise SystemExit("Mobile card highlight has already been added")

          anchor = "@media (prefers-reduced-motion: reduce) {"
          if css.count(anchor) != 1:
              raise SystemExit("Could not locate the reduced-motion anchor")

          mobile_override = r'''/* Mobile card selection uses one continuous card highlight. */
          @media (max-width: 760px) {
            body[data-guide-section="auction-house"] .table-wrap > table > tbody > tr.ah-row-selectable {
              -webkit-tap-highlight-color: transparent;
            }
            body[data-guide-section="auction-house"] .table-wrap > table > tbody > tr.ah-row-selected {
              border-color: rgba(var(--section-ah-rgb), .72);
              background:
                linear-gradient(135deg, rgba(var(--section-ah-rgb), .16), rgba(var(--section-ah-rgb), .055) 58%, var(--surface-section));
              box-shadow:
                inset 4px 0 var(--section-ah-accent),
                0 0 0 2px rgba(var(--section-ah-rgb), .12),
                0 10px 24px rgba(0,0,0,.26);
            }
            body[data-guide-section="auction-house"] .table-wrap > table > tbody > tr.ah-row-selected > td {
              background: transparent !important;
              border-bottom-color: transparent !important;
              box-shadow: none !important;
            }
            body[data-guide-section="auction-house"] .table-wrap > table > tbody > tr.ah-row-selected > td[data-column="target"] {
              background: rgba(var(--market-price-target-buyout-rgb), .10) !important;
              border: 1px solid rgba(var(--market-price-target-buyout-rgb), .40) !important;
            }
          }

          '''
          css = css.replace(anchor, mobile_override + anchor, 1)
          css_path.write_text(css, encoding="utf-8")

          icons_path = Path("assets/ah-guide-icons.css")
          icons = icons_path.read_text(encoding="utf-8")
          old_import = 'ah-price-guide.css?v=20260724-ah-universal-v1'
          new_import = 'ah-price-guide.css?v=20260724-ah-mobile-select-v2'
          if icons.count(old_import) != 1:
              raise SystemExit("Unexpected AH guide stylesheet import version")
          icons_path.write_text(icons.replace(old_import, new_import, 1), encoding="utf-8")

          old_link = 'ah-guide-icons.css?v=20260724-ah-universal-v1'
          new_link = 'ah-guide-icons.css?v=20260724-ah-mobile-select-v2'
          for name in guide_names:
              path = Path("guides") / name
              text = path.read_text(encoding="utf-8")
              if text.count(old_link) != 1:
                  raise SystemExit(f"Unexpected stylesheet link in {path}")
              path.write_text(text.replace(old_link, new_link, 1), encoding="utf-8")

          updated_css = css_path.read_text(encoding="utf-8")
          required = [
              marker,
              "tr.ah-row-selected > td[data-column=\"target\"]",
              "-webkit-tap-highlight-color: transparent",
              "inset 4px 0 var(--section-ah-accent)",
          ]
          for needle in required:
              if needle not in updated_css:
                  raise SystemExit(f"Missing mobile selection rule: {needle}")

          if old_import in icons_path.read_text(encoding="utf-8"):
              raise SystemExit("Old imported CSS cache key remains")
          for name in guide_names:
              text = (Path("guides") / name).read_text(encoding="utf-8")
              if new_link not in text or old_link in text:
                  raise SystemExit(f"Cache key validation failed for {name}")
          PY

          rm -f .github/workflows/temporary-ah-mobile-highlight-fix.yml
          rm -f .github/ah-mobile-highlight-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ah-price-guide.css assets/ah-guide-icons.css guides .github
          git diff --cached --check
          git commit -m "Refine mobile Auction House row highlighting"
          git push --force origin agent/fix-ah-mobile-highlight
