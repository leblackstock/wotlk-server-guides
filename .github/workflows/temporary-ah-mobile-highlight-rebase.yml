name: Temporary AH mobile highlight rebase

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-mobile-highlight-rebase-trigger.txt

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild mobile highlight branch on clean main
        shell: bash
        run: |
          git fetch origin agent/fix-ah-mobile-highlight
          git switch -C agent/fix-ah-mobile-highlight main
          git checkout origin/agent/fix-ah-mobile-highlight -- \
            assets/ah-price-guide.css \
            assets/ah-guide-icons.css \
            guides/mining-smithing-ah-price-guide.html \
            guides/blacksmithing-materials-ah-price-guide.html \
            guides/engineering-materials-ah-price-guide.html \
            guides/jewelcrafting-gems-ah-price-guide.html \
            guides/enchanting-mats-ah-price-guide.html \
            guides/alchemy-materials-ah-price-guide.html \
            guides/herbalism-herbs-ah-price-guide.html \
            guides/inscription-materials-ah-price-guide.html \
            guides/tailoring-cloth-ah-price-guide.html \
            guides/skinning-leatherworking-materials-ah-price-guide.html \
            guides/fishing-cooking-materials-ah-price-guide.html \
            guides/cross-profession-materials-ah-price-guide.html \
            guides/drop-turn-in-quest-page-items-ah-price-guide.html \
            guides/gear-pattern-drops-ah-price-guide.html \
            guides/utility-recipe-drops-ah-price-guide.html \
            guides/consumable-misc-recipe-drops-ah-price-guide.html

          test "$(grep -c 'Mobile card selection uses one continuous card highlight' assets/ah-price-guide.css)" -eq 1
          test "$(grep -R -l 'ah-guide-icons.css?v=20260724-ah-mobile-select-v2' guides/*-ah-price-guide.html | wc -l)" -eq 16
          ! grep -R 'ah-guide-icons.css?v=20260724-ah-universal-v1' guides/*-ah-price-guide.html
          grep -q 'ah-price-guide.css?v=20260724-ah-mobile-select-v2' assets/ah-guide-icons.css

          rm -f .github/workflows/temporary-ah-mobile-highlight-rebase.yml
          rm -f .github/ah-mobile-highlight-rebase-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ah-price-guide.css assets/ah-guide-icons.css guides .github
          git diff --cached --check
          git commit -m "Refine mobile Auction House row highlighting"
          git push --force origin agent/fix-ah-mobile-highlight
