name: Temporary rebase AH cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/rebase-ah-cleanup-trigger.txt

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild the cleanup branch on clean main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin

          git diff --binary origin/main...origin/agent/remove-ah-inline-css -- \
            assets/ah-guide-icons.css \
            assets/ah-price-guide.css \
            guides > /tmp/ah-cleanup.patch

          test -s /tmp/ah-cleanup.patch

          git switch main
          rm -f .github/workflows/temporary-rebase-ah-cleanup.yml
          git add -u .github/workflows/temporary-rebase-ah-cleanup.yml
          git commit -m "Remove temporary AH cleanup rebase workflow"
          git push origin main

          git fetch origin main
          git switch -C agent/remove-ah-inline-css origin/main
          git apply --index /tmp/ah-cleanup.patch
          git diff --cached --check
          git commit -m "Remove duplicated AH inline CSS"
          git push --force origin agent/remove-ah-inline-css
