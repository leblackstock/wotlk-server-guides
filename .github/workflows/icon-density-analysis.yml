name: Guide icon density analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "guides/**"
      - "assets/**"
      - "data/**"
      - "templates/spec-guide/**"
      - "tools/analyze-guide-icon-density.mjs"
      - ".github/workflows/icon-density-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install temporary DOM analyzer
        run: npm install --no-save --no-package-lock jsdom@24

      - name: Analyze rendered guide icons
        run: |
          node tools/analyze-guide-icon-density.mjs --out icon-density-report.json | tee icon-density-report.md

      - name: Upload icon-density report
        uses: actions/upload-artifact@v4
        with:
          name: icon-density-report
          path: |
            icon-density-report.json
            icon-density-report.md
