name: Guide icon density analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "guides/**"
      - "assets/**"
      - "data/**"
      - "templates/spec-guide/**"
      - "tools/audit-spec-guide.mjs"
      - "tools/analyze-guide-icon-density.mjs"
      - "tools/audit-playbook-ability-icons.mjs"
      - "tools/render-fresh-80-spec-guides.mjs"
      - "tools/create-spec-guide-scaffold.mjs"
      - "tools/create-complete-spec-guide.mjs"
      - ".github/workflows/icon-density-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate workflow scripts
        run: |
          node --check tools/audit-spec-guide.mjs
          node --check tools/analyze-guide-icon-density.mjs
          node --check tools/audit-playbook-ability-icons.mjs
          node --check tools/render-fresh-80-spec-guides.mjs
          node --check tools/create-spec-guide-scaffold.mjs
          node --check tools/create-complete-spec-guide.mjs

      - name: Analyze rendered baseline
        run: |
          mkdir -p icon-density-reports
          node tools/analyze-guide-icon-density.mjs \
            --policy templates/spec-guide/icon-density-policy.json \
            --out icon-density-reports/reference-families.json \
            | tee icon-density-reports/reference-families.md

      - name: Enforce every production guide config
        shell: bash
        run: |
          shopt -s nullglob
          for config in templates/spec-guide/*.config.json; do
            status=$(node -e 'const c=require("./"+process.argv[1]); process.stdout.write(c.iconDensityStatus || "required");' "$config")
            slug=$(node -e 'const c=require("./"+process.argv[1]); process.stdout.write(c.specSlug);' "$config")

            if [[ "$status" == "grandfathered" ]]; then
              echo "Skipping grandfathered baseline: $slug"
              continue
            fi

            if [[ "$status" != "required" ]]; then
              echo "::error file=$config::iconDensityStatus must be required or the specifically approved grandfathered baseline."
              exit 1
            fi

            node tools/analyze-guide-icon-density.mjs \
              --config "$config" \
              --policy templates/spec-guide/icon-density-policy.json \
              --enforce \
              --out "icon-density-reports/${slug}.json" \
              | tee "icon-density-reports/${slug}.md"
          done

      - name: Enforce playbook ability icons after density approval
        shell: bash
        run: |
          shopt -s nullglob
          for config in templates/spec-guide/*.config.json; do
            node tools/audit-playbook-ability-icons.mjs "$config"
          done

      - name: Verify release-audit routing
        run: node tools/audit-spec-guide.mjs templates/spec-guide/blood-death-knight.config.json --release

      - name: Upload icon-density reports
        uses: actions/upload-artifact@v4
        with:
          name: icon-density-report
          path: icon-density-reports/
