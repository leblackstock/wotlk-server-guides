name: Guide icon density analysis

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "guides/**"
      - "assets/**"
      - "data/**"
      - "templates/spec-guide/**"
      - "tools/analyze-guide-icon-density.mjs"
      - ".github/workflows/icon-density-analysis.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install temporary DOM analyzer
        run: npm install --no-save --no-package-lock jsdom@24

      - name: Analyze rendered baseline
        run: |
          mkdir -p icon-density-reports
          node tools/analyze-guide-icon-density.mjs \
            --policy templates/spec-guide/icon-density-policy.json \
            --out icon-density-reports/reference-families.json \
            | tee icon-density-reports/reference-families.md

      - name: Enforce opted-in guide configs
        shell: bash
        run: |
          shopt -s nullglob
          for config in templates/spec-guide/*.config.json; do
            enabled=$(node -e 'const c=require("./"+process.argv[1]); process.stdout.write(String(c.enforceIconDensity === true));' "$config")
            if [[ "$enabled" != "true" ]]; then
              continue
            fi
            slug=$(node -e 'const c=require("./"+process.argv[1]); process.stdout.write(c.specSlug);' "$config")
            node tools/analyze-guide-icon-density.mjs \
              --config "$config" \
              --policy templates/spec-guide/icon-density-policy.json \
              --enforce \
              --out "icon-density-reports/${slug}.json" \
              | tee "icon-density-reports/${slug}.md"
          done

      - name: Upload icon-density reports
        uses: actions/upload-artifact@v4
        with:
          name: icon-density-report
          path: icon-density-reports/
