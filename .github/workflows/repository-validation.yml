name: Repository validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Python and local-link validation
        shell: bash
        run: |
          for test_file in tests/*.py; do
            python "$test_file"
          done

      - name: Run Node validation
        run: npm run test:node

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            node --check "$script"
          done < <(find assets tools tests -type f \
            \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0)

      - name: Run browser smoke tests
        shell: bash
        run: |
          python -m http.server 4173 >"$RUNNER_TEMP/wotlk-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi

            if [[ "$attempt" -eq 20 ]]; then
              cat "$RUNNER_TEMP/wotlk-http.log"
              exit 1
            fi

            sleep 1
          done

          npm run test:browser
