name: Temporary AH universal table rebase

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-universal-rebase-trigger.txt

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine and rebuild the universal AH table branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/universal-ah-table-system
          git branch -f source-snapshot origin/agent/universal-ah-table-system

          scoped=(
            assets/ah-guide-icons.css
            assets/ah-price-guide.css
            guides/mining-smithing-ah-price-guide.html
            guides/blacksmithing-materials-ah-price-guide.html
            guides/engineering-materials-ah-price-guide.html
            guides/jewelcrafting-gems-ah-price-guide.html
            guides/enchanting-mats-ah-price-guide.html
            guides/alchemy-materials-ah-price-guide.html
            guides/herbalism-herbs-ah-price-guide.html
            guides/inscription-materials-ah-price-guide.html
            guides/tailoring-cloth-ah-price-guide.html
            guides/skinning-leatherworking-materials-ah-price-guide.html
            guides/fishing-cooking-materials-ah-price-guide.html
            guides/cross-profession-materials-ah-price-guide.html
            guides/drop-turn-in-quest-page-items-ah-price-guide.html
            guides/gear-pattern-drops-ah-price-guide.html
            guides/utility-recipe-drops-ah-price-guide.html
            guides/consumable-misc-recipe-drops-ah-price-guide.html
            internal/color-system-addons-ah.html
          )

          merge_base="$(git merge-base main source-snapshot)"
          conflicts="$(git diff --name-only "$merge_base"..main -- "${scoped[@]}")"
          if [ -n "$conflicts" ]; then
            echo "Scoped files changed on main after the migration branch was created:" >&2
            echo "$conflicts" >&2
            exit 1
          fi

          rm -f .github/workflows/temporary-ah-universal-rebase.yml
          git add .github/workflows/temporary-ah-universal-rebase.yml
          git commit -m "Remove temporary AH universal rebase workflow"
          git push origin main
          clean_main="$(git rev-parse HEAD)"

          git switch -C agent/universal-ah-table-system "$clean_main"
          git checkout source-snapshot -- "${scoped[@]}"

          echo '' | base64 -d | gzip -d > /tmp/refine-ah-css.py
          python -m py_compile /tmp/refine-ah-css.py
          python /tmp/refine-ah-css.py

          git add "${scoped[@]}"
          git diff --cached --check
          git commit -m "Standardize Auction House table layouts"
          git push --force origin agent/universal-ah-table-system
