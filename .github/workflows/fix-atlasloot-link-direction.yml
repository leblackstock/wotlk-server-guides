name: Fix AtlasLoot Link Direction

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-atlasloot-link-direction

      - name: Apply wording and styling correction
        run: python scripts/fix-atlasloot-link-direction.py

      - name: Build and validate catalog
        run: |
          python scripts/build-addon-catalog.py
          python scripts/validate-addon-catalog.py
          python scripts/build-addon-catalog.py --check
          node tests/addon-search.test.js
          git diff --check

      - name: Install browser test tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Run browser smoke tests
        run: |
          python -m http.server 4173 >/tmp/addon-catalog-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/guides/addons.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/addon-browser-smoke.cjs

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/addon-catalog-data.js assets/addon-catalog.js assets/addon-catalog.css data/addons.json guides/addons.html tests/addon-search.test.js tests/addon-browser-smoke.cjs
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Fix AtlasLoot Discord directions and styling"
          git push origin HEAD:agent/fix-atlasloot-link-direction
