name: Run Pawn Catalog Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-pawn-138

      - name: Apply Pawn migration
        run: |
          set +e
          python scripts/apply-pawn-catalog.py > /tmp/pawn-migration.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/pawn-migration.log
          if [ "$STATUS" -ne 0 ]; then
            cp /tmp/pawn-migration.log tests/pawn-migration-error.txt
          fi

      - name: Build and validate catalog
        run: |
          if [ -f tests/pawn-migration-error.txt ]; then exit 0; fi
          python scripts/build-addon-catalog.py
          python scripts/validate-addon-catalog.py
          python scripts/build-addon-catalog.py --check
          node tests/addon-search.test.js
          git diff --check

      - name: Install browser test tooling
        run: |
          if [ -f tests/pawn-migration-error.txt ]; then exit 0; fi
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Run browser smoke tests
        run: |
          if [ -f tests/pawn-migration-error.txt ]; then exit 0; fi
          python -m http.server 4173 >/tmp/addon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/addon-browser-smoke.cjs

      - name: Commit catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f tests/pawn-migration-error.txt ]; then
            git add tests/pawn-migration-error.txt
            git commit -m "Capture Pawn migration error"
          else
            git add data/addons.json assets/addon-catalog-data.js assets/addons/icons/pawn.svg guides/addons.html scripts/validate-addon-catalog.py tests/addon-search.test.js tests/addon-browser-smoke.cjs
            git commit -m "Add tested Pawn 1.3.8"
          fi
          git push origin HEAD:agent/add-pawn-138
