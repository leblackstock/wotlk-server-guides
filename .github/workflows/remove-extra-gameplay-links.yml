name: Remove extra gameplay links

on:
  push:
    branches:
      - agent/one-gameplay-guide-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/one-gameplay-guide-link
          fetch-depth: 0
      - name: Keep one gameplay guide card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          patterns = [
              r'\n\s*<a class="guide-card" href="\.\/guides\/protection-paladin-gear-targets\.html">.*?<\/a>',
              r'\n\s*<a class="guide-card" href="\.\/guides\/protection-paladin-raiding\.html#raid-notes">.*?<\/a>',
          ]

          for pattern in patterns:
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Expected one match for {pattern}, found {count}')

          if text.count('href="./guides/protection-paladin-pve-guide.html"') != 1:
              raise SystemExit('Quick Start card missing or duplicated')
          if 'href="./guides/protection-paladin-gear-targets.html"' in text:
              raise SystemExit('Equipping card still present')
          if 'href="./guides/protection-paladin-raiding.html#raid-notes"' in text:
              raise SystemExit('Raid notes card still present')

          path.write_text(text, encoding='utf-8', newline='')
          PY
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: keep one gameplay guide link"
          git push origin HEAD:agent/one-gameplay-guide-link
