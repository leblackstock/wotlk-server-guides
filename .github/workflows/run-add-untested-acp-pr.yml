name: Run Untested ACP Build

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-test-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-untested-acp

      - name: Patch duplicate browser marker
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-acp-catalog.py')
          text = path.read_text(encoding='utf-8')
          old = '    text = replace_once(text, drawer_marker, drawer_checks + drawer_marker, "browser ACP drawer")\n'
          new = '    if drawer_marker not in text:\n        raise RuntimeError("browser ACP drawer marker not found")\n    text = text.replace(drawer_marker, drawer_checks + drawer_marker, 1)\n'
          if old not in text:
              raise SystemExit('Expected ACP drawer replacement line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply ACP catalog migration
        run: python scripts/apply-acp-catalog.py

      - name: Build and validate catalog
        run: |
          python scripts/build-addon-catalog.py
          python scripts/validate-addon-catalog.py
          python scripts/build-addon-catalog.py --check
          node tests/addon-search.test.js
          git diff --check

      - name: Install browser test tooling
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null

      - name: Run browser smoke tests
        run: |
          python -m http.server 4173 >/tmp/addon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/addon-browser-smoke.cjs

      - name: Commit clean catalog changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-untested-acp.yml .github/workflows/run-add-untested-acp-pr.yml scripts/apply-acp-catalog.py
          git add data/addons.json assets/addon-catalog-data.js assets/addons/icons/addon-control-panel.svg guides/addons.html scripts/validate-addon-catalog.py tests/addon-search.test.js tests/addon-browser-smoke.cjs
          git commit -m "Add untested Addon Control Panel 3.3.7"
          git push origin HEAD:agent/add-untested-acp
