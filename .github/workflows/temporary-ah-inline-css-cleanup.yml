name: Temporary AH inline CSS cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-inline-css-cleanup-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record AH inline CSS differences
        shell: bash
        run: |
          git switch -C agent/diagnose-ah-inline-css
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import difflib
          import hashlib
          import re

          guide_names = [
              "mining-smithing-ah-price-guide.html",
              "blacksmithing-materials-ah-price-guide.html",
              "engineering-materials-ah-price-guide.html",
              "jewelcrafting-gems-ah-price-guide.html",
              "enchanting-mats-ah-price-guide.html",
              "alchemy-materials-ah-price-guide.html",
              "herbalism-herbs-ah-price-guide.html",
              "inscription-materials-ah-price-guide.html",
              "tailoring-cloth-ah-price-guide.html",
              "skinning-leatherworking-materials-ah-price-guide.html",
              "fishing-cooking-materials-ah-price-guide.html",
              "cross-profession-materials-ah-price-guide.html",
              "drop-turn-in-quest-page-items-ah-price-guide.html",
              "gear-pattern-drops-ah-price-guide.html",
              "utility-recipe-drops-ah-price-guide.html",
              "consumable-misc-recipe-drops-ah-price-guide.html",
          ]
          pattern = re.compile(r"<style>\s*(.*?)\s*</style>", re.S)
          records = []
          for name in guide_names:
              path = Path("guides") / name
              text = path.read_text(encoding="utf-8")
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f"Missing inline style: {path}")
              style = match.group(1).strip()
              digest = hashlib.sha256(style.encode("utf-8")).hexdigest()
              records.append((name, digest, style))

          groups = defaultdict(list)
          for name, digest, style in records:
              groups[digest].append(name)

          lines = [
              "Auction House inline CSS diagnostics",
              "====================================",
              f"Files checked: {len(records)}",
              f"Unique style blocks: {len(groups)}",
              "",
          ]
          for index, (digest, names) in enumerate(sorted(groups.items()), start=1):
              lines.append(f"Group {index}: {digest}")
              lines.extend(f"  - {name}" for name in names)
              lines.append("")

          baseline_name, baseline_digest, baseline = records[0]
          lines.extend([
              f"Baseline: {baseline_name}",
              "",
              "Differences from baseline",
              "-------------------------",
          ])
          for name, digest, style in records[1:]:
              if digest == baseline_digest:
                  continue
              lines.append("")
              lines.append(f"### {name}")
              lines.extend(difflib.unified_diff(
                  baseline.splitlines(),
                  style.splitlines(),
                  fromfile=baseline_name,
                  tofile=name,
                  lineterm="",
              ))

          report = Path("internal/ah-inline-css-diagnostics.txt")
          report.write_text("\n".join(lines).rstrip() + "\n", encoding="utf-8")
          PY

          rm -f .github/workflows/temporary-ah-inline-css-cleanup.yml
          rm -f .github/ah-inline-css-cleanup-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/ah-inline-css-diagnostics.txt .github
          git diff --cached --check
          git commit -m "Record AH inline CSS differences"
          git push --force origin agent/diagnose-ah-inline-css
