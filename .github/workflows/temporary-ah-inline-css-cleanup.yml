name: Temporary AH inline CSS cleanup

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-inline-css-cleanup-trigger.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Move AH layout CSS into the shared stylesheet
        shell: bash
        run: |
          git switch -C agent/remove-ah-inline-css
          python - <<'PY'
          from pathlib import Path
          import re

          guide_names = [
              "mining-smithing-ah-price-guide.html",
              "blacksmithing-materials-ah-price-guide.html",
              "engineering-materials-ah-price-guide.html",
              "jewelcrafting-gems-ah-price-guide.html",
              "enchanting-mats-ah-price-guide.html",
              "alchemy-materials-ah-price-guide.html",
              "herbalism-herbs-ah-price-guide.html",
              "inscription-materials-ah-price-guide.html",
              "tailoring-cloth-ah-price-guide.html",
              "skinning-leatherworking-materials-ah-price-guide.html",
              "fishing-cooking-materials-ah-price-guide.html",
              "cross-profession-materials-ah-price-guide.html",
              "drop-turn-in-quest-page-items-ah-price-guide.html",
              "gear-pattern-drops-ah-price-guide.html",
              "utility-recipe-drops-ah-price-guide.html",
              "consumable-misc-recipe-drops-ah-price-guide.html",
          ]
          style_pattern = re.compile(r"<style>\s*(.*?)\s*</style>", re.S)

          def parse_rules(css):
              rules = []
              index = 0
              length = len(css)
              while index < length:
                  while index < length and css[index].isspace():
                      index += 1
                  if index >= length:
                      break
                  if css.startswith("/*", index):
                      end = css.find("*/", index + 2)
                      if end < 0:
                          raise ValueError("Unclosed CSS comment")
                      index = end + 2
                      continue

                  start = index
                  quote = None
                  paren_depth = 0
                  bracket_depth = 0
                  while index < length:
                      char = css[index]
                      if quote:
                          if char == "\\":
                              index += 2
                              continue
                          if char == quote:
                              quote = None
                      elif char in "\"'":
                          quote = char
                      elif char == "(":
                          paren_depth += 1
                      elif char == ")":
                          paren_depth = max(0, paren_depth - 1)
                      elif char == "[":
                          bracket_depth += 1
                      elif char == "]":
                          bracket_depth = max(0, bracket_depth - 1)
                      elif char in "{;" and paren_depth == 0 and bracket_depth == 0:
                          break
                      index += 1

                  if index >= length:
                      tail = css[start:].strip()
                      if tail:
                          rules.append(("statement", tail, ""))
                      break

                  prelude = css[start:index].strip()
                  if css[index] == ";":
                      rules.append(("statement", prelude + ";", ""))
                      index += 1
                      continue

                  index += 1
                  body_start = index
                  depth = 1
                  quote = None
                  while index < length and depth:
                      char = css[index]
                      if quote:
                          if char == "\\":
                              index += 2
                              continue
                          if char == quote:
                              quote = None
                      elif char in "\"'":
                          quote = char
                      elif css.startswith("/*", index):
                          end = css.find("*/", index + 2)
                          if end < 0:
                              raise ValueError("Unclosed CSS comment")
                          index = end + 2
                          continue
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              break
                      index += 1
                  if depth != 0:
                      raise ValueError(f"Unclosed CSS block for {prelude}")
                  body = css[body_start:index].strip()
                  rules.append(("block", prelude, body))
                  index += 1
              return rules

          def canonical(rule):
              kind, prelude, body = rule
              if kind == "statement":
                  return prelude.strip()
              return f"{prelude.strip()}{{{body.strip()}}}"

          def split_selectors(prelude):
              parts = []
              start = 0
              paren = bracket = 0
              quote = None
              for index, char in enumerate(prelude):
                  if quote:
                      if char == quote and (index == 0 or prelude[index - 1] != "\\"):
                          quote = None
                  elif char in "\"'":
                      quote = char
                  elif char == "(":
                      paren += 1
                  elif char == ")":
                      paren = max(0, paren - 1)
                  elif char == "[":
                      bracket += 1
                  elif char == "]":
                      bracket = max(0, bracket - 1)
                  elif char == "," and paren == 0 and bracket == 0:
                      parts.append(prelude[start:index].strip())
                      start = index + 1
              parts.append(prelude[start:].strip())
              return [part for part in parts if part]

          def scope_selector(selector, scope):
              selector = selector.strip()
              if selector == ":root":
                  return None
              if selector == "body":
                  return scope
              if selector.startswith("body"):
                  return scope + selector[4:]
              if selector == "*":
                  return f"{scope}, {scope} *"
              return f"{scope} {selector}"

          def scope_rules(rules, scope):
              output = []
              for kind, prelude, body in rules:
                  if kind == "statement":
                      output.append(prelude)
                      continue
                  stripped = prelude.strip()
                  if stripped == ":root":
                      continue
                  if stripped.startswith("@media") or stripped.startswith("@supports") or stripped.startswith("@container"):
                      inner = scope_rules(parse_rules(body), scope)
                      output.append(f"{stripped}{{\n{inner}\n}}")
                      continue
                  if stripped.startswith("@keyframes") or stripped.startswith("@font-face"):
                      output.append(f"{stripped}{{{body}}}")
                      continue
                  selectors = []
                  for selector in split_selectors(stripped):
                      scoped = scope_selector(selector, scope)
                      if scoped:
                          selectors.append(scoped)
                  if selectors:
                      output.append(f"{', '.join(selectors)}{{{body}}}")
              return "\n".join(output)

          records = []
          documents = {}
          for name in guide_names:
              path = Path("guides") / name
              text = path.read_text(encoding="utf-8")
              matches = style_pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one inline style block: {path}")
              rules = parse_rules(matches[0].strip())
              records.append((name, rules))
              documents[path] = text

          rule_sets = [set(canonical(rule) for rule in rules if rule[1].strip() != ":root") for _, rules in records]
          common_keys = set.intersection(*rule_sets)
          baseline_rules = records[0][1]
          common_rules = [rule for rule in baseline_rules if canonical(rule) in common_keys and rule[1].strip() != ":root"]

          shared_path = Path("assets/ah-price-guide.css")
          shared = shared_path.read_text(encoding="utf-8")
          if "Shared AH base layout migrated from guide HTML" in shared:
              raise SystemExit("AH base layout has already been migrated")
          import_match = re.match(r'(@import url\([^\n]+\);\s*)', shared)
          if not import_match:
              raise SystemExit("Missing color-system import in ah-price-guide.css")
          import_line = '@import url("./guide-color-system.css?v=20260724-ah-shared-v3");'
          semantic_css = shared[import_match.end():].lstrip()
          semantic_css = semantic_css.replace('body:has(.ah-guide-heading)', 'body[data-guide-section="auction-house"]')

          chunks = [
              import_line,
              "/* Shared AH base layout migrated from guide HTML. */",
              scope_rules(common_rules, 'body[data-guide-section="auction-house"]'),
          ]

          for name, rules in records:
              extras = [rule for rule in rules if canonical(rule) not in common_keys and rule[1].strip() != ":root"]
              if not extras:
                  continue
              slug = Path(name).stem
              chunks.append(f"/* Guide-specific legacy rules retained for {slug}. */")
              chunks.append(scope_rules(extras, f'body[data-ah-guide="{slug}"]'))

          chunks.extend([
              "/* Semantic Auction House identity and interaction layer. */",
              semantic_css,
          ])
          shared_path.write_text("\n\n".join(chunk.strip() for chunk in chunks if chunk.strip()).rstrip() + "\n", encoding="utf-8")

          icons_path = Path("assets/ah-guide-icons.css")
          icons = icons_path.read_text(encoding="utf-8")
          icons, import_count = re.subn(
              r'ah-price-guide\.css\?v=[^\")]+',
              'ah-price-guide.css?v=20260724-ah-shared-v3',
              icons,
              count=1,
          )
          if import_count != 1:
              raise SystemExit("Failed to update ah-price-guide.css import cache key")
          icons_path.write_text(icons, encoding="utf-8")

          for path, text in documents.items():
              name = path.name
              slug = path.stem
              text, style_count = style_pattern.subn("", text, count=1)
              if style_count != 1:
                  raise SystemExit(f"Failed to remove inline CSS: {path}")
              text, link_count = re.subn(
                  r'\.\./assets/ah-guide-icons\.css\?v=[^\"]+',
                  '../assets/ah-guide-icons.css?v=20260724-ah-shared-v3',
                  text,
                  count=1,
              )
              if link_count != 1:
                  raise SystemExit(f"Failed to update stylesheet link: {path}")
              if "<body>" not in text:
                  raise SystemExit(f"Expected a plain body element before migration: {path}")
              text = text.replace(
                  "<body>",
                  f'<body data-guide-section="auction-house" data-ah-guide="{slug}">',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          for path in documents:
              text = path.read_text(encoding="utf-8")
              slug = path.stem
              if "<style" in text or "</style>" in text:
                  raise SystemExit(f"Inline CSS remains: {path}")
              marker = f'data-guide-section="auction-house" data-ah-guide="{slug}"'
              if text.count(marker) != 1:
                  raise SystemExit(f"Incorrect guide markers: {path}")
              if "ah-guide-icons.css?v=20260724-ah-shared-v3" not in text:
                  raise SystemExit(f"New shared stylesheet cache key missing: {path}")

          migrated = shared_path.read_text(encoding="utf-8")
          required = [
              "Shared AH base layout migrated from guide HTML",
              'body[data-guide-section="auction-house"] .table-wrap>table',
              ".pricepair.target",
              ".site-nav",
              "ah-row-selected",
          ]
          for needle in required:
              if needle not in migrated:
                  raise SystemExit(f"Shared stylesheet missing expected rule: {needle}")
          if "body:has(.ah-guide-heading)" in migrated:
              raise SystemExit("Legacy :has section detection remains in shared AH CSS")
          PY

          rm -f .github/workflows/temporary-ah-inline-css-cleanup.yml
          rm -f .github/ah-inline-css-cleanup-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ah-price-guide.css assets/ah-guide-icons.css guides .github
          git diff --cached --check
          git commit -m "Remove duplicated AH inline CSS"
          git push --force origin agent/remove-ah-inline-css
