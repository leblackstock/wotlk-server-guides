name: Temporary AH universal table migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
    paths:
      - .github/ah-universal-table-trigger.txt

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build the universal Auction House table system
        shell: bash
        run: |
          git switch -C agent/universal-ah-table-system
          echo '' | base64 -d | gzip -d > /tmp/migrate-ah-tables.py
          python -m py_compile /tmp/migrate-ah-tables.py
          python /tmp/migrate-ah-tables.py

          rm -f .github/workflows/temporary-ah-universal-table-migration.yml
          rm -f .github/ah-universal-table-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ah-price-guide.css assets/ah-guide-icons.css guides internal/color-system-addons-ah.html .github
          git diff --cached --check
          git commit -m "Standardize Auction House table layouts"
          git push --force origin agent/universal-ah-table-system
